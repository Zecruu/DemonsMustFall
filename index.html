<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#07060a" />
    <title>Demons Must Fall</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>

      <div id="hud" class="hud" hidden>
        <div id="hp" class="hud-hp"></div>
        <div id="wave" class="hud-center"></div>
        <div id="fallen" class="hud-right"></div>
      </div>

      <div id="touch" class="touch" hidden>
        <div id="stick" class="stick" role="presentation" aria-label="Move">
          <div id="stick-knob" class="stick-knob"></div>
        </div>
        <button id="attack" class="attack" type="button" aria-label="Strike">STRIKE</button>
      </div>

      <section id="title" class="overlay">
        <p class="kicker">iOS combat scaffold</p>
        <h1>Demons Must Fall</h1>
        <p class="lede">Hunt them. Strike them. Watch them fall.</p>
        <p class="hint">Stick to move · Strike to attack<br />Keyboard: WASD + Space</p>
        <button id="start" type="button">Begin the hunt</button>
      </section>

      <section id="gameover" class="overlay" hidden>
        <h1>You have fallen</h1>
        <p id="summary" class="lede"></p>
        <button id="retry" type="button">Rise again</button>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
